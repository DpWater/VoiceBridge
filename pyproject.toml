[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "voicebridge"
version = "0.1.0"
description = "A local-first voice command workbench for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VoiceBridge contributors" }]
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "sounddevice>=0.5,<1",
  "numpy>=1.26,<3",
  "faster-whisper>=1.1,<2",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "pynput>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
voicebridge = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/config/secrets.py" = ["BLE001"]
"app/services/workflow_controller.py" = ["BLE001"]
"app/ui/main_window.py" = ["BLE001"]
