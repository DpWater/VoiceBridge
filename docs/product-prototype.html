<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceBridge — 光标粘贴原型</title>
  <style>
    :root { color-scheme:dark; --bg:#080d1b; --surface:#111b31; --line:#273859; --text:#f4f7ff; --muted:#9aaccc; --cyan:#22d3ee; --green:#21c7a4; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 24% 18%,#1b3263 0,transparent 31%),radial-gradient(circle at 84% 85%,#30205c 0,transparent 34%),var(--bg); }
    .stage { width:min(1050px,94vw); min-height:650px; position:relative; overflow:hidden; border:1px solid #304361; border-radius:22px; background:#0c1426cc; box-shadow:0 30px 100px #000b; }
    header { height:66px; padding:0 26px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:#10192c; }
    .brand { font-weight:760; font-size:18px; } .brand b { color:var(--cyan); } .ready { font-size:13px; color:#b8ffe4; } .ready i { display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:#4fe0b9; box-shadow:0 0 14px #4fe0b9; }
    .workspace { position:absolute; inset:66px 0 0; padding:52px 70px; opacity:.35; filter:blur(.1px); pointer-events:none; }
    .workspace h1 { margin:0 0 12px; font-size:30px; } .workspace p { color:var(--muted); font-size:15px; }
    .ghost-chat { width:58%; margin-top:52px; padding:18px; border:1px solid #31466b; border-radius:16px; background:#10192e; } .ghost-line { height:11px; margin:12px 0; border-radius:99px; background:#40577e; } .ghost-line.short { width:56%; } .cursor { display:inline-block; width:2px; height:18px; margin:0 3px -4px; background:var(--cyan); animation:blink 1s step-end infinite; } @keyframes blink { 50% { opacity:0; } }
    .bubble { width:min(610px,calc(100% - 32px)); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:20px; border:1px solid #49638e; border-radius:18px; background:linear-gradient(140deg,#182844,#10192d); box-shadow:0 20px 70px #000c; transition:.18s ease; }
    .bubble.dismissed { opacity:0; transform:translate(-50%,-44%); pointer-events:none; }
    .bubble-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px; } .bubble-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; } .mic { width:26px; height:26px; display:grid; place-items:center; border-radius:9px; color:#08231f; background:var(--green); } .hint { color:var(--muted); font-size:12px; }
    textarea { width:100%; min-height:130px; padding:14px; resize:vertical; color:var(--text); border:1px solid #3b5279; border-radius:12px; outline:none; background:#091224; font:15px/1.6 inherit; } textarea:focus { border-color:var(--cyan); box-shadow:0 0 0 3px #22d3ee1c; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; } .keys { color:var(--muted); font-size:12px; } kbd { padding:2px 5px; border:1px solid #52698f; border-radius:5px; color:#dfeaff; background:#1a2942; font-family:inherit; font-size:11px; }
    button { padding:10px 14px; border:1px solid #486184; border-radius:10px; color:#dce9ff; background:#18253d; font:650 13px inherit; cursor:pointer; } button:hover { background:#223554; } button.primary { color:#06251f; border-color:transparent; background:var(--green); } button.primary:hover { background:#3de0c1; }
    .sent { display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(470px,calc(100% - 32px)); padding:28px; text-align:center; border:1px solid #297965; border-radius:18px; background:#102d2c; box-shadow:0 20px 70px #000b; } .sent.show { display:block; } .sent strong { display:block; font-size:19px; color:#baffed; } .sent p { margin:9px 0 19px; color:#a9d9cd; line-height:1.5; }
    .corner-note { position:absolute; right:28px; bottom:22px; color:#7285aa; font-size:12px; }
    @media (max-width:650px) { .workspace { padding:35px 25px; } .bubble { top:46%; } .footer { align-items:stretch; flex-direction:column; } .footer button { width:100%; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="VoiceBridge 光标粘贴交互原型">
    <header><div class="brand"><b>◉</b> VoiceBridge</div><div class="ready"><i></i>等待你的快捷键</div></header>
    <section class="workspace" aria-hidden="true">
      <h1>Trae · 当前对话</h1>
      <p>光标已停在这里<span class="cursor"></span></p>
      <div class="ghost-chat"><div class="ghost-line"></div><div class="ghost-line short"></div><div class="ghost-line"></div></div>
    </section>
    <section class="bubble" id="bubble" aria-label="识别文字确认框">
      <div class="bubble-head"><div class="bubble-title"><span class="mic">⌁</span>刚刚识别到的文字</div><span class="hint">可以直接修改</span></div>
      <textarea id="text" autofocus>请检查 Router 的条件分支：当请求没有 thread_id 时，是否会错误恢复上一次 LangGraph checkpoint？只分析问题和建议，不要修改代码。</textarea>
      <div class="footer"><div class="keys"><kbd>Enter</kbd> 粘贴到光标处　<kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</div><button class="primary" id="paste">粘贴到光标处 ↵</button></div>
    </section>
    <section class="sent" id="sent" aria-live="polite">
      <strong>已粘贴到原来的光标处</strong>
      <p>没有自动按回车，也没有自动发送。你可以继续编辑后自行提交。</p>
      <button id="again">模拟下一次语音识别</button>
    </section>
    <div class="corner-note">Esc 取消本次粘贴</div>
  </main>
  <script>
    const bubble = document.getElementById('bubble');
    const sent = document.getElementById('sent');
    const text = document.getElementById('text');
    function pasteAtCursor() {
      if (!text.value.trim()) { text.focus(); return; }
      bubble.classList.add('dismissed');
      sent.classList.add('show');
    }
    document.getElementById('paste').addEventListener('click', pasteAtCursor);
    text.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); pasteAtCursor(); }
      if (event.key === 'Escape') { bubble.classList.add('dismissed'); }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { bubble.classList.add('dismissed'); }
    });
    document.getElementById('again').addEventListener('click', () => {
      sent.classList.remove('show');
      bubble.classList.remove('dismissed');
      text.focus();
    });
  </script>
</body>
</html>
